name: Release

# Build a release binary on tag push (or manual dispatch) and attach it to a
# GitHub Release. macOS runners are Apple silicon by default on macos-14.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test --parallel

      - name: Build release
        run: swift build -c release

      - name: Verify
        run: .build/release/tempo version

      - name: Strip + archive
        id: archive
        run: |
          strip -SX .build/release/tempo
          ARCH=$(uname -m)
          TAG="${GITHUB_REF_NAME:-dev}"
          NAME="tempo-${TAG}-darwin-${ARCH}.tar.gz"
          (cd .build/release && tar -czf "$NAME" tempo)
          mv ".build/release/$NAME" .
          shasum -a 256 "$NAME" > "${NAME}.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.archive.outputs.name }}
            ${{ steps.archive.outputs.name }}.sha256

      - name: Upload as workflow artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tempo-darwin
          path: |
            ${{ steps.archive.outputs.name }}
            ${{ steps.archive.outputs.name }}.sha256
